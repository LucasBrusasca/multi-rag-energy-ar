[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-rag-energy-ar"
version = "0.1.0"
description = "Governed Multi-RAG research system for regulated knowledge domains."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"multirag.ingestion" = ["*.json", "*.sql", "migrations/*.sql"]
